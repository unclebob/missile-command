# Format: window <role> <agent> <worktree> [task|batch] [extra-cli-args...]
# The optional receive mode defaults to task. Use batch for roles that should
# consume all currently queued equal-priority handoffs as one batch.
# Any fields after the receive mode are passed to the agent CLI, e.g. --yolo.
window specifier codex  master --dangerously-bypass-approvals-and-sandbox
window coder codex  coder --dangerously-bypass-approvals-and-sandbox
window cleaner codex  cleaner batch --dangerously-bypass-approvals-and-sandbox
window architect codex  architect batch --dangerously-bypass-approvals-and-sandbox
window hardender codex  hardender batch --dangerously-bypass-approvals-and-sandbox
window QA codex  QA batch --dangerously-bypass-approvals-and-sandbox
